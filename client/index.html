<!doctype html>
<html lang="he">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/l.png" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- הכותרת, התיאור והכתובת מגיעים מ-src/seo/pages.js. בבנייה כל עמוד מקבל קובץ HTML משלו עם הערכים שלו,
       כדי שגוגל, וואטסאפ ופייסבוק יראו אותם גם בלי להריץ את הריאקט -->
  <title>%SEO_TITLE%</title>
  <meta name="description" content="%SEO_DESCRIPTION%" />
  <link rel="canonical" href="%SEO_URL%" />
  <meta name="theme-color" content="#2D382B" />

  <!-- תצוגה בשיתוף קישור (וואטסאפ, פייסבוק, לינקדאין) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="he_IL" />
  <meta property="og:site_name" content="סרויה ניהול פרויקטים" />
  <meta property="og:title" content="%SEO_TITLE%" />
  <meta property="og:description" content="%SEO_DESCRIPTION%" />
  <meta property="og:url" content="%SEO_URL%" />
  <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="סרויה ניהול פרויקטים ופיקוח בנייה" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- "כרטיס עסק" לגוגל: מי העסק, מה הוא עושה ואיפה הוא ברשתות -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GeneralContractor",
      "name": "סרויה ניהול פרויקטים",
      "alternateName": ["סרויה", "Sroia"],
      "description": "ליווי, ניהול ופיקוח מקצועי לבנייה פרטית מהמגרש ועד המפתח",
      "url": "%SITE_URL%/",
      "logo": "%SITE_URL%/l.png",
      "image": "%SITE_URL%/og-image.jpg",
      "areaServed": "IL",
      "foundingDate": "2011",
      "sameAs": [
        "https://www.instagram.com/sroiaproject",
        "https://www.facebook.com/share/17V4qfkUeM/"
      ]
    }
  </script>
  <!-- שם האתר שגוגל מציג מעל הקישור בתוצאות החיפוש -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "סרויה ניהול פרויקטים",
      "alternateName": ["סרויה", "Sroia"],
      "url": "%SITE_URL%/"
    }
  </script>
  <!--
    יציאה מחלון התשלום:
    התשלום של Cardcom נפתח בתוך iframe באתר. בסוף התשלום Cardcom מעבירים את ה-iframe לכתובת באתר,
    ובלי זה האתר כולו היה נטען בתוך החלון הקטן ("אתר בתוך אתר").
    האתר אף פעם לא מציג את עצמו בתוך iframe, אז אם זה קורה: מעבירים את החלון הראשי לאותה כתובת
    ולא טוענים כלום בתוך ה-iframe. זה רץ לפני React, כדי שלא יהיה הבהוב.
  -->
  <script>
    (function () {
      try {
        if (window.self === window.top) return;
        // גישה לכתובת של החלון הראשי עובדת רק אם הוא האתר שלנו. אחרת נזרקת שגיאה ולא עושים כלום
        if (window.top.location.origin !== window.location.origin) return;
        window.__FRAME_BREAKOUT__ = true;
        document.documentElement.style.display = "none";
        window.top.location.replace(window.location.href);
      } catch (e) { /* חלון ראשי מאתר אחר - לא נוגעים */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/Main.jsx"></script>
</body>

</html>
