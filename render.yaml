# הגדרות ההעלאה ל-Render (Blueprint).
# ב-Render: New > Blueprint, בוחרים את הריפו, ו-Render יוצר את האתר לפי הקובץ הזה.
services:
  - type: web
    runtime: static
    name: sroia
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # כל כתובת באתר נטענת דרך index.html, כדי שרענון בעמוד פנימי לא ייתן 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # כותרות אבטחה שהדפדפן מקבל עם כל דף באתר
    headers:
      # אתרים אחרים לא יכולים להציג את האתר בתוך iframe שלהם (הגנה מפני clickjacking).
      # האתר עצמו כן יכול, וזה מה שמאפשר לדף התוצאה להיטען בתוך חלון התשלום של Cardcom
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self'"
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # הדפדפן ייכנס לאתר רק ב-https
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # הדפדפן לא ינחש סוגי קבצים
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # אתרים חיצוניים (כולל Cardcom) מקבלים רק את כתובת האתר, בלי הנתיב והפרמטרים
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # הכתובת של האתר (הדומיין)
      - key: SITE_URL
        value: https://sroia.co.il
      # הכתובת של השרת - האתר שולח אליה את כל הבקשות (טפסים, תמונות, סרטונים)
      - key: VITE_API_URL
        value: https://api.sroia.co.il

  # פאנל הניהול (React) - אתר סטטי נפרד
  - type: web
    runtime: static
    name: sroia-admin
    rootDir: admin/sroia-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # רענון בעמוד פנימי (למשל /calendar) נטען דרך index.html ולא נותן 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # אף אתר לא יכול להציג את הפאנל בתוך iframe
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      # הכתובת של השרת - הפאנל שולח אליה את כל הבקשות
      - key: VITE_API_URL
        value: https://api.sroia.co.il
